name: Sector Performance Report

on:
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: '시장 선택'
        required: false
        default: 'ALL'
        type: choice
        options:
          - US
          - KR
          - ALL

permissions:
  contents: write

jobs:
  sector-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set date and market
        run: |
          echo "TODAY=$(date +%Y%m%d)" >> $GITHUB_ENV
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MARKET=${{ inputs.market }}" >> $GITHUB_ENV
          elif [ "$HOUR" -lt 12 ]; then
            echo "MARKET=KR" >> $GITHUB_ENV
          else
            echo "MARKET=US" >> $GITHUB_ENV
          fi
          echo "SUBJECT=[섹터] 장마감 성과 분석 - $(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas matplotlib numpy

      - name: Set email subject
        run: |
          if [ "${{ env.MARKET }}" = "KR" ]; then
            echo "SUBJECT=[국장 섹터] 장마감 성과 분석 - ${{ env.TODAY }}" >> $GITHUB_ENV
          elif [ "${{ env.MARKET }}" = "US" ]; then
            echo "SUBJECT=[미장 섹터] 장마감 성과 분석 - ${{ env.TODAY }}" >> $GITHUB_ENV
          else
            echo "SUBJECT=[섹터 분석] 장마감 성과 - ${{ env.TODAY }}" >> $GITHUB_ENV
          fi

      - name: Generate sector report
        run: |
          mkdir -p reports
          python3 stock_report.py --sector --market ${{ env.MARKET }} \
            --output reports/sector_${{ env.MARKET }}_${{ env.TODAY }}.txt

      - name: Collect attachments
        run: |
          FILES="reports/sector_${{ env.MARKET }}_${{ env.TODAY }}.txt"
          for f in reports/risk_chart_*.png; do
            [ -f "$f" ] && FILES="$FILES,$f"
          done
          echo "ATTACHMENTS=$FILES" >> $GITHUB_ENV

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ env.SUBJECT }}
          to: pooq1553@gmail.com
          from: 투자보고서봇
          body: |
            ${{ env.MARKET }} 시장 장마감 후 섹터별 성과 분석 보고서입니다.
          attachments: ${{ env.ATTACHMENTS }}

      - name: Commit and push report
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || (git commit -m "sector: $(date +%Y-%m-%d) ${{ env.MARKET }} 섹터 보고서" && git pull --rebase && git push)
