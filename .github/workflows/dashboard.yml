name: Theme Scanner Page

on:
  schedule:
    # 미장 마감 16:00 ET → 16:40 ET 실행.
    # 썸머타임(EDT)이면 20:40 UTC, 표준시(EST)면 21:40 UTC가 해당한다.
    # 뉴욕 현지시각을 보고 한쪽만 실행한다.
    - cron: '40 20 * * 1-5'
    - cron: '40 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 미장 마감 직후인지 판단한다 (크론은 UTC 고정이라 썸머타임을 못 따라간다).
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Check US market close
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ny = datetime.now(ZoneInfo("America/New_York"))
          close = ny.replace(hour=16, minute=0, second=0, microsecond=0)
          mins = (ny - close).total_seconds() / 60

          go = os.environ["EVENT_NAME"] == "workflow_dispatch" or 30 <= mins < 90
          print(f"ET {ny:%m-%d %H:%M} {ny.tzname()} (마감+{mins:.0f}분) -> go={go}",
                file=sys.stderr)
          print(f"go={'true' if go else 'false'}")
          PY

  publish:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Build page
        run: |
          mkdir -p _site
          python3 build_dashboard.py -o _site/index.html

      # Pages 설정이 안 켜져 있어도 실패로 남지 않게 한다.
      # (설정을 켜는 순간부터 아래 두 단계가 성공하며 주소가 살아난다)
      - name: Upload Pages artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report result
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "페이지 배포 완료: ${{ steps.deploy.outputs.page_url }}"
          else
            echo "GitHub Pages가 아직 켜져 있지 않습니다."
            echo "아래 주소에서 Source를 'GitHub Actions'로 바꾸면 다음 실행부터 배포됩니다."
            echo "  https://github.com/${{ github.repository }}/settings/pages"
            echo "(메일 첨부로는 계속 정상 발송됩니다)"
          fi
