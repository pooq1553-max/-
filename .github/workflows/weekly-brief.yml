name: Weekly Live Brief

on:
  schedule:
    # 일요일 08:45 KST (= 토요일 23:45 UTC) — 방송 전에 메일로 받는다
    - cron: '45 23 * * 6'
  workflow_dispatch:
    inputs:
      send_email:
        description: '메일 보내기 (끄면 Actions 아티팩트로만 남음)'
        required: false
        default: true
        type: boolean
      print_data:
        description: '집계 데이터를 로그에 출력 (점검용)'
        required: false
        default: false
        type: boolean

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas matplotlib numpy pykrx requests lxml html5lib beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
          # PDF에 한글이 깨지지 않게
          sudo apt-get install -y -q fonts-noto-cjk

      - name: Build weekly brief
        env:
          # 선택: KRX 데이터 계정이 있으면 외국인·기관 순매수 TOP과 업종 등락까지 나온다.
          # 없으면 네이버(투자자별 순매수) + yfinance(특징주·테마 ETF)로 대체한다.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          mkdir -p reports
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          python3 weekly_brief.py -o reports/weekly_brief_$TODAY.html \
            --pdf reports/weekly_brief_$TODAY.pdf \
            --text reports/weekly_brief_$TODAY.txt \
            --json reports/weekly_brief_$TODAY.json
          cat reports/weekly_brief_$TODAY.txt

      - name: Print data
        if: inputs.print_data
        run: |
          python3 - <<'EOF'
          import os
          s = open(f"reports/weekly_brief_{os.environ['TODAY']}.json", encoding="utf-8").read()
          for i in range(0, len(s), 3000):
              print("PAYLOAD|" + s[i:i + 3000])
          EOF

      # 메일이 안 와도 Actions 화면에서 받을 수 있게 남겨둔다
      - name: Upload brief
        uses: actions/upload-artifact@v4
        with:
          name: weekly-brief-${{ env.TODAY }}
          path: reports/weekly_brief_${{ env.TODAY }}.*
          retention-days: 30

      - name: Send email
        if: github.event_name == 'schedule' || inputs.send_email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[주간 라이브] 미장·국장 주간 시황 - ${{ env.TODAY }}"
          to: pooq1553@gmail.com
          from: 투자보고서봇
          # 본문에 글 보고서를 그대로 넣는다 (첨부를 안 열어도 읽힘)
          body: file://reports/weekly_brief_${{ env.TODAY }}.txt
          # PDF: 폰·PC 어디서나 바로 열림 / HTML: 브라우저로 열면 차트에 마우스 올려 상세 확인
          attachments: reports/weekly_brief_${{ env.TODAY }}.pdf,reports/weekly_brief_${{ env.TODAY }}.html
