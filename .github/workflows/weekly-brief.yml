name: Weekly Live Brief
run-name: ${{ inputs.notes != '' && inputs.send_email && 'Weekly Live Brief (원고 포함 발송)' || 'Weekly Live Brief' }}

# 평소 흐름: 일요일 아침 Claude 예약 작업이 이 워크플로우를 두 번 수동 실행한다.
#   1) print_data=true, send_email=false 로 데이터를 받아 방송 원고를 쓰고
#   2) notes(원고)와 link(보고서 주소)를 넣어 메일 발송
# 아래 스케줄은 그 작업이 실패했을 때만 메일을 보내는 예비 실행이다.
on:
  schedule:
    # 일요일 10:45 KST (= 01:45 UTC)
    - cron: '45 1 * * 0'
  workflow_dispatch:
    inputs:
      send_email:
        description: '메일 보내기 (끄면 Actions 아티팩트로만 남음)'
        required: false
        default: true
        type: boolean
      print_data:
        description: '집계 데이터를 로그에 출력 (점검용)'
        required: false
        default: false
        type: boolean
      notes:
        description: '방송 원고 JSON ([{"tag","h","b"}, ...])'
        required: false
        default: ''
        type: string
      link:
        description: '온라인 보고서 주소 (메일 본문 맨 위에 표시)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  # 예비 실행(스케줄)은 오늘 원고 포함 메일이 이미 나갔으면 건너뛴다
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Check already sent
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "${{ github.repository }}" --workflow weekly-brief.yml --status success \
                --created ">=$since" --json displayTitle \
                --jq '[.[] | select(.displayTitle | contains("원고 포함"))] | length')
          echo "원고 포함 발송 ${n}건 (최근 12시간)"
          if [ "$n" -gt 0 ]; then echo "go=false" >> $GITHUB_OUTPUT; else echo "go=true" >> $GITHUB_OUTPUT; fi

  brief:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas matplotlib numpy pykrx requests lxml html5lib beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
          # PDF에 한글이 깨지지 않게
          sudo apt-get install -y -q fonts-noto-cjk

      - name: Build weekly brief
        env:
          # 선택: KRX 데이터 계정이 있으면 외국인·기관 순매수 TOP과 업종 등락까지 나온다.
          # 없으면 네이버(투자자별 순매수) + yfinance(특징주·테마 ETF)로 대체한다.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NOTES: ${{ inputs.notes }}
          LINK: ${{ inputs.link }}
        run: |
          mkdir -p reports
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          EXTRA=()
          if [ -n "$NOTES" ]; then printf '%s' "$NOTES" > notes.json; EXTRA+=(--notes notes.json); fi
          if [ -n "$LINK" ]; then EXTRA+=(--link "$LINK"); fi
          python3 weekly_brief.py "${EXTRA[@]}" -o reports/weekly_brief_$TODAY.html \
            --pdf reports/weekly_brief_$TODAY.pdf \
            --text reports/weekly_brief_$TODAY.txt \
            --json reports/weekly_brief_$TODAY.json
          cat reports/weekly_brief_$TODAY.txt

      - name: Print data
        if: inputs.print_data
        run: |
          python3 - <<'EOF'
          import os
          s = open(f"reports/weekly_brief_{os.environ['TODAY']}.json", encoding="utf-8").read()
          for i in range(0, len(s), 3000):
              print("PAYLOAD|" + s[i:i + 3000])
          EOF

      # 메일이 안 와도 Actions 화면에서 받을 수 있게 남겨둔다
      - name: Upload brief
        uses: actions/upload-artifact@v4
        with:
          name: weekly-brief-${{ env.TODAY }}
          path: reports/weekly_brief_${{ env.TODAY }}.*
          retention-days: 30

      - name: Send email
        if: github.event_name == 'schedule' || inputs.send_email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[주간 라이브] 미장·국장 주간 시황 - ${{ env.TODAY }}"
          to: pooq1553@gmail.com
          from: 투자보고서봇
          # 본문에 글 보고서를 그대로 넣는다 (첨부를 안 열어도 읽힘)
          body: file://reports/weekly_brief_${{ env.TODAY }}.txt
          # PDF: 폰·PC 어디서나 바로 열림 / HTML: 브라우저로 열면 차트에 마우스 올려 상세 확인
          attachments: reports/weekly_brief_${{ env.TODAY }}.pdf,reports/weekly_brief_${{ env.TODAY }}.html
