name: Daily Stock Report

on:
  schedule:
    # 국장 마감 15:30 KST → 15:50 KST 실행 → 메일 16:00 KST 전후
    - cron: '50 6 * * 1-5'
    # 미장 마감 16:00 ET → 16:40 ET 실행. 썸머타임(EDT)이면 아래 20:40 UTC가,
    # 표준시(EST)면 21:40 UTC가 걸린다. 뉴욕 현지시각을 보고 한쪽만 실행한다.
    - cron: '40 20 * * 1-5'
    - cron: '40 21 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: '시장 선택'
        required: false
        default: 'ALL'
        type: choice
        options:
          - US
          - KR
          - ALL

jobs:
  # 지금이 어느 시장의 마감 직후인지 판단한다.
  # 크론은 UTC 고정이라 미국 썸머타임을 못 따라가므로 여기서 걸러낸다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      market: ${{ steps.decide.outputs.market }}
      today: ${{ steps.decide.outputs.today }}
    steps:
      - name: Decide market
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MARKET: ${{ inputs.market }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          kr = datetime.now(ZoneInfo("Asia/Seoul"))
          ny = datetime.now(ZoneInfo("America/New_York"))

          def since_close(dt, h, m):
              close = dt.replace(hour=h, minute=m, second=0, microsecond=0)
              return (dt - close).total_seconds() / 60

          kr_min = since_close(kr, 15, 30)   # 국장 마감
          ny_min = since_close(ny, 16, 0)    # 미장 마감 (썸머타임 자동 반영)

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              go, market = True, (os.environ.get("INPUT_MARKET") or "ALL")
          elif 0 <= kr_min < 60:
              go, market = True, "KR"
          elif 30 <= ny_min < 90:
              go, market = True, "US"
          else:
              go, market = False, "SKIP"

          today = (ny if market == "US" else kr).strftime("%Y%m%d")

          print(f"KST {kr:%m-%d %H:%M} (마감+{kr_min:.0f}분) | "
                f"ET {ny:%m-%d %H:%M} {ny.tzname()} (마감+{ny_min:.0f}분) "
                f"-> market={market} go={go}", file=sys.stderr)

          print(f"go={'true' if go else 'false'}")
          print(f"market={market}")
          print(f"today={today}")
          PY

  generate-report:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      MARKET: ${{ needs.gate.outputs.market }}
      TODAY: ${{ needs.gate.outputs.today }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas matplotlib numpy lxml beautifulsoup4 html5lib pykrx

      - name: Set email subject
        run: |
          if [ "${{ env.MARKET }}" = "KR" ]; then
            echo "SUBJECT=[국장] 거래대금 TOP100 신고가 - ${{ env.TODAY }}" >> $GITHUB_ENV
          elif [ "${{ env.MARKET }}" = "US" ]; then
            echo "SUBJECT=[미장] 신고가 + 테마별 관심종목 + 미너비니 - ${{ env.TODAY }}" >> $GITHUB_ENV
          else
            echo "SUBJECT=[투자] 종합 보고서 - ${{ env.TODAY }}" >> $GITHUB_ENV
          fi

      - name: Generate KR new-highs report (KOSPI+KOSDAQ full market)
        if: env.MARKET == 'KR' || env.MARKET == 'ALL'
        run: |
          mkdir -p reports
          python3 stock_report.py --kr-highs \
            --output reports/kr_highs_${{ env.TODAY }}.txt

      - name: Generate 52-week high report (US)
        if: env.MARKET == 'US' || env.MARKET == 'ALL'
        run: |
          mkdir -p reports
          python3 stock_report.py --market US --no-chart \
            --output reports/report_US_${{ env.TODAY }}.txt

      - name: Generate Minervini scan (US only)
        if: env.MARKET == 'US' || env.MARKET == 'ALL'
        run: |
          python3 stock_report.py --minervini \
            --output reports/minervini_${{ env.TODAY }}.txt

      - name: Generate Long Base Breakout scan (US only)
        if: env.MARKET == 'US' || env.MARKET == 'ALL'
        run: |
          python3 stock_report.py --longbase \
            --output reports/longbase_${{ env.TODAY }}.txt

      - name: Generate Stage 2 base-consolidation scan (US only)
        if: env.MARKET == 'US' || env.MARKET == 'ALL'
        continue-on-error: true
        run: |
          python3 stage2_scan.py \
            --out-dir reports \
            --txt stage2_${{ env.TODAY }}.txt \
            --png stage2_${{ env.TODAY }}.png

      - name: Build theme scanner page (US only)
        if: env.MARKET == 'US' || env.MARKET == 'ALL'
        continue-on-error: true
        run: |
          mkdir -p reports
          python3 build_dashboard.py -o reports/theme_scanner_${{ env.TODAY }}.html

      - name: Collect attachments
        run: |
          FILES=""
          for f in reports/theme_scanner_${{ env.TODAY }}.html \
                   reports/kr_highs_${{ env.TODAY }}.txt \
                   reports/report_US_${{ env.TODAY }}.txt \
                   reports/minervini_${{ env.TODAY }}.txt \
                   reports/longbase_${{ env.TODAY }}.txt \
                   reports/stage2_${{ env.TODAY }}.txt \
                   reports/stage2_${{ env.TODAY }}.png; do
            if [ -f "$f" ]; then
              if [ -z "$FILES" ]; then FILES="$f"; else FILES="$FILES,$f"; fi
            fi
          done
          echo "ATTACHMENTS=$FILES" >> $GITHUB_ENV

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ env.SUBJECT }}
          to: pooq1553@gmail.com
          from: 투자보고서봇
          body: |
            ${{ env.MARKET }} 시장 장마감 후 보고서입니다.

            ■ 테마별 관심종목 보기
            첨부된 theme_scanner_${{ env.TODAY }}.html 파일을 눌러서 열어주세요.
            탭으로 테마를 넘기고, 종목을 누르면 봉차트가 뜹니다.
            (인터넷 없이도 열립니다)

            첨부:
            - theme_scanner (html): 87개 테마 / 816종목 탭 + 봉차트
            - kr_highs: 국장 거래대금 TOP100 x 52주 신고가 (KR)
            - report_US: 52주 신고가 + 거래대금 보고서 (US)
            - 미너비니 SEPA 피봇바이 스캔 (US)
            - 롱베이스 돌파 스캔 (US)
            - Stage 2 + 베이스 다지기 스캔 (US, 나스닥100+S&P500)
              → stage2_YYYYMMDD.txt: Trend Template 통과 종목 순위
              → stage2_YYYYMMDD.png: 상위 20종목 차트 (베이스=노란 밴드, 피봇=점선)
          attachments: ${{ env.ATTACHMENTS }}
