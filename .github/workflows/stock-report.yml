name: Daily Stock Report

on:
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: '시장 선택'
        required: false
        default: 'ALL'
        type: choice
        options:
          - US
          - KR
          - ALL

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set date and market
        run: |
          echo "TODAY=$(date +%Y%m%d)" >> $GITHUB_ENV
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MARKET=${{ inputs.market }}" >> $GITHUB_ENV
          elif [ "$HOUR" -lt 12 ]; then
            echo "MARKET=KR" >> $GITHUB_ENV
          else
            echo "MARKET=US" >> $GITHUB_ENV
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas matplotlib numpy

      - name: Set email subject
        run: |
          if [ "${{ env.MARKET }}" = "KR" ]; then
            echo "SUBJECT=[국장] 52주 신고가 보고서 - ${{ env.TODAY }}" >> $GITHUB_ENV
          elif [ "${{ env.MARKET }}" = "US" ]; then
            echo "SUBJECT=[미장] 신고가 + 미너비니 + 롱베이스 - ${{ env.TODAY }}" >> $GITHUB_ENV
          else
            echo "SUBJECT=[투자] 52주 신고가 보고서 - ${{ env.TODAY }}" >> $GITHUB_ENV
          fi

      - name: Generate 52-week high report
        run: |
          mkdir -p reports
          python3 stock_report.py --market ${{ env.MARKET }} --no-chart \
            --output reports/report_${{ env.MARKET }}_${{ env.TODAY }}.txt

      - name: Generate Minervini scan (US only)
        if: env.MARKET == 'US' || env.MARKET == 'ALL'
        run: |
          python3 stock_report.py --minervini \
            --output reports/minervini_${{ env.TODAY }}.txt

      - name: Generate Long Base Breakout scan (US only)
        if: env.MARKET == 'US' || env.MARKET == 'ALL'
        run: |
          python3 stock_report.py --longbase \
            --output reports/longbase_${{ env.TODAY }}.txt

      - name: Generate 52W-high pullback charts (US only)
        if: env.MARKET == 'US' || env.MARKET == 'ALL'
        run: |
          python3 new_high_charts.py \
            --out-dir reports \
            --image new_high_charts_${{ env.TODAY }}.png \
            --text new_high_charts_${{ env.TODAY }}.txt

      - name: Collect attachments
        run: |
          FILES="reports/report_${{ env.MARKET }}_${{ env.TODAY }}.txt"
          if [ -f "reports/minervini_${{ env.TODAY }}.txt" ]; then
            FILES="$FILES,reports/minervini_${{ env.TODAY }}.txt"
          fi
          if [ -f "reports/longbase_${{ env.TODAY }}.txt" ]; then
            FILES="$FILES,reports/longbase_${{ env.TODAY }}.txt"
          fi
          if [ -f "reports/new_high_charts_${{ env.TODAY }}.png" ]; then
            FILES="$FILES,reports/new_high_charts_${{ env.TODAY }}.png"
          fi
          if [ -f "reports/new_high_charts_${{ env.TODAY }}.txt" ]; then
            FILES="$FILES,reports/new_high_charts_${{ env.TODAY }}.txt"
          fi
          echo "ATTACHMENTS=$FILES" >> $GITHUB_ENV

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ env.SUBJECT }}
          to: pooq1553@gmail.com
          from: 투자보고서봇
          body: |
            ${{ env.MARKET }} 시장 장마감 후 보고서입니다.

            첨부:
            - 52주 신고가 + 거래대금 보고서 (텍스트)
            - 미너비니 SEPA / 롱베이스 돌파 스캔 (US)
            - new_high_charts_*.png: 52주 신고가 종목 7일 가격 + Stochastic %K 그리드 차트
              → 초록색 셀(%K ≤ 30)이 눌림목 매수 매력 구간
            - new_high_charts_*.txt: Stochastic 낮은 순 랭킹
          attachments: ${{ env.ATTACHMENTS }}
