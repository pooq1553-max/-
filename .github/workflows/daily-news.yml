name: Daily Morning News

on:
  schedule:
    # 매일 한국시간 오전 6시 = UTC 전날 21시
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate broadcast news script
        run: |
          mkdir -p reports
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          echo "SCRIPT_PATH=reports/news_${TODAY}.txt" >> $GITHUB_ENV
          python3 news_script.py --target 400 --output reports/news_${TODAY}.txt

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[아침방송] ${{ env.TODAY }} 약 400음절 낭독 스크립트"
          to: pooq1553@gmail.com
          from: 아침뉴스봇
          body: file://${{ env.SCRIPT_PATH }}
          attachments: ${{ env.SCRIPT_PATH }}
